<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[가장 마음에 드는 메이크업을 골라주세요]</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #F9F8F6;
            color: #5A504B;
            text-align: center;
            margin: 0;
            padding: 2vh 20px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        #round-info {
            font-size: 1.2rem;
            font-weight: 600;
            color: #9A8C84;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .item {
            flex: 1;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-radius: 16px;
            overflow: hidden;
            /* 여백이 생길 때 자연스럽게 배경과 어우러지도록 배경색 맞춤 */
            background: #F9F8F6; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }
        .item img {
            width: 100%;
            height: 65vh;
            /* 🌟 머리카락 잘림 방지: 원본 비율을 유지하며 상자 안에 쏙 들어가게 함 */
            object-fit: contain; 
        }
        /* 🌟 선택 중에는 샵 이름 숨기기 */
        .item .name {
            display: none; 
        }
        #result {
            display: none;
            animation: fadeIn 0.8s ease;
        }
        #result img {
            max-width: 500px;
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .vs-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: #D8D0C8;
            margin: 0 10px;
        }
        .btn-restart {
            margin-top: 30px;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background: #8A7B76;
            color: white;
            border-radius: 30px;
            transition: background 0.2s;
        }
        .btn-restart:hover {
            background: #5A504B;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 600px) {
            .container { flex-direction: column; gap: 10px; }
            .item img { height: 40vh; }
            .vs-text { font-size: 1.5rem; margin: 5px 0; }
        }
    </style>
</head>
<body>

    <h1>[가장 마음에 드는 메이크업을 골라주세요]</h1>
    <div id="round-info">준비 중...</div>

    <div id="game" class="container">
        <div class="item" id="left-item" onclick="select(0)">
            <img id="left-img" src="" alt="Left">
            <div class="name" id="left-name">이름</div>
        </div>
        <div class="vs-text">VS</div>
        <div class="item" id="right-item" onclick="select(1)">
            <img id="right-img" src="" alt="Right">
            <div class="name" id="right-name">이름</div>
        </div>
    </div>

    <div id="result">
        <h2 style="color: #8A7B76;">🎉 최종 선택된 메이크업샵 🎉</h2>
        <img id="winner-img" src="" alt="Winner">
        <div class="name" id="winner-name" style="font-size: 2rem; margin-top: 20px; font-weight: bold;">이름</div>
        <button class="btn-restart" onclick="location.reload()">다시 하기</button>
    </div>

    <script>
        const data = [
            { name: "daum-a", img: "daum-a.png" },
            { name: "daum-b", img: "daum-b.png" },
            { name: "daum-c", img: "daum-c.jpg" },
            { name: "daum-d", img: "daum-d.jpg" },
            { name: "jiel-a", img: "jiel-a.jpg" },
            { name: "jiel-b", img: "jiel-b.jpg" },
            { name: "jiel-c", img: "jiel-c.png" },
            { name: "jiel-d", img: "jiel-d.png" },
            { name: "kim-a", img: "kim-a.jfif" },
            { name: "kim-b", img: "kim-b.jfif" },
            { name: "kim-c", img: "kim-c.jfif" },
            { name: "kim-d", img: "kim-d.jfif" },
            { name: "mul-a", img: "mul-a.jpeg" },
            { name: "mul-c", img: "mul-c.jpg" },
            { name: "mul-d", img: "mul-d.jpg" },
            { name: "mul-e", img: "mul-e.jpg" },
            { name: "pure-a", img: "pure-a.png" },
            { name: "sunwoo-a", img: "sunwoo-a.jpg" },
            { name: "sunwoo-b", img: "sunwoo-b.jpg" },
            { name: "sunwoo-c", img: "sunwoo-c.jpg" }
        ];

        let currentRound = [];
        let nextRound = [];
        let currentIndex = 0;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            currentRound = shuffle([...data]); 
            updateRoundText();
            showMatch();
        }

        function updateRoundText() {
            const roundInfo = document.getElementById("round-info");
            if (currentRound.length === 2) {
                roundInfo.innerText = "🏆 결승전 🏆";
            } else {
                let totalMatches = Math.floor(currentRound.length / 2);
                let currentMatch = (currentIndex / 2) + 1;
                roundInfo.innerText = `${currentRound.length}강 (${currentMatch}/${totalMatches})`;
            }
        }

        function showMatch() {
            document.getElementById("left-img").src = currentRound[currentIndex].img;
            document.getElementById("left-name").innerText = currentRound[currentIndex].name;

            document.getElementById("right-img").src = currentRound[currentIndex + 1].img;
            document.getElementById("right-name").innerText = currentRound[currentIndex + 1].name;
        }

        function select(choice) {
            nextRound.push(currentRound[currentIndex + choice]);
            currentIndex += 2; 

            if (currentIndex === currentRound.length - 1) {
                nextRound.push(currentRound[currentIndex]);
                currentIndex++; 
            }

            if (currentIndex >= currentRound.length) {
                currentRound = nextRound;
                nextRound = [];
                currentIndex = 0;

                if (currentRound.length === 1) {
                    showResult();
                    return;
                }
            }
            updateRoundText();
            showMatch();
        }

        function showResult() {
            document.getElementById("game").style.display = "none";
            document.getElementById("round-info").style.display = "none";
            document.getElementById("result").style.display = "block";

            document.getElementById("winner-img").src = currentRound[0].img;
            document.getElementById("winner-name").innerText = currentRound[0].name;
        }

        window.onload = initGame;
    </script>
</body>
</html>
