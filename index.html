<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이크업샵 고르기</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #F9F8F6;
            color: #5A504B;
            text-align: center;
            margin: 0;
            padding: 2vh 20px;
        }
        
        /* 🌟 인트로 화면 스타일 🌟 */
        #intro {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            animation: fadeIn 0.8s ease;
            padding: 20px 0;
        }
        .wedding-info {
            margin-bottom: 30px;
        }
        .wedding-date {
            font-size: 1.2rem;
            color: #9A8C84;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .wedding-names {
            font-size: 1.8rem;
            font-weight: 800;
            color: #5A504B;
        }
        #intro h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #5A504B;
            word-break: keep-all;
        }
        .guide-box {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            text-align: left;
            margin-bottom: 20px;
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
        }
        .guide-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: #8A7B76;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #F0EBE6;
            padding-bottom: 15px;
        }
        .guide-box p {
            font-size: 1.15rem;
            color: #7A6C65;
            margin: 12px 0;
            line-height: 1.6;
            position: relative;
            padding-left: 15px;
            word-break: keep-all;
        }
        .guide-box p::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #D8D0C8;
            font-weight: bold;
        }
        .btn-start {
            margin-top: 30px;
            padding: 18px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background: #8A7B76;
            color: white;
            border-radius: 40px;
            box-shadow: 0 8px 20px rgba(138, 123, 118, 0.2);
            transition: all 0.2s ease;
        }
        .btn-start:hover {
            background: #5A504B;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(90, 80, 75, 0.3);
        }

        /* 🌟 게임 & 결과 화면 스타일 🌟 */
        #game-section {
            display: none; 
            animation: fadeIn 0.8s ease;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        #round-info {
            font-size: 1.2rem;
            font-weight: 600;
            color: #9A8C84;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .item {
            flex: 1;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-radius: 16px;
            overflow: hidden;
            background: #F9F8F6; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }
        .item img {
            width: 100%;
            height: 65vh;
            object-fit: contain; 
        }
        .item .name {
            display: none; 
        }

        #result {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease;
        }
        .result-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 60px;
            margin-top: 30px;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .winner-box {
            flex: 1.2;
        }
        .winner-box img {
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .ranking-box {
            flex: 0.8;
            text-align: left;
            padding-top: 20px;
        }
        .ranking-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid #EAE5E0;
            color: #8A7B76;
        }
        .rank-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.3rem;
            padding: 15px;
            background: #FDFCFB;
            border-radius: 12px;
            border-left: 5px solid #D8D0C8;
        }
        .rank-number {
            font-weight: 900;
            font-size: 1.8rem;
            margin-right: 20px;
            color: #8A7B76;
            min-width: 30px;
        }
        .rank-1 { border-left-color: #D4AF37; } 
        .rank-1 .rank-number { color: #D4AF37; }
        .rank-2 { border-left-color: #AAA9AD; } 
        .rank-2 .rank-number { color: #AAA9AD; }
        .rank-3 { border-left-color: #CD7F32; } 
        .rank-3 .rank-number { color: #CD7F32; }

        .vs-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: #D8D0C8;
            margin: 0 10px;
        }
        .btn-restart {
            margin-top: 40px;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background: #8A7B76;
            color: white;
            border-radius: 30px;
            transition: background 0.2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 850px) {
            .result-wrapper { flex-direction: column; align-items: center; }
            .ranking-box { width: 100%; }
            .container { flex-direction: column; }
            .item img { height: 40vh; }
            #intro h1 { font-size: 1.6rem; }
            .guide-box { padding: 25px; }
            .guide-box p { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <!-- 🌟 첫 화면 (인트로) 🌟 -->
    <div id="intro">
        <div class="wedding-info">
            <div class="wedding-date">2027.3.27. 16:00</div>
            <div class="wedding-names">🤵🏻‍♂️김태헌 ❤️ 황기연👰🏻</div>
        </div>
        
        <h1>가장 마음에 드는 메이크업 사진을 골라주세요.</h1>
        
        <div class="guide-box">
            <div class="guide-title">방법</div>
            <p>마음에 드는 메이크업 사진을 클릭하세요.</p>
            <p>사진을 확대해서 볼 수 있어요.</p>
            <p>외모보다는 메이크업을 기준으로 선택해주세요.</p>
        </div>
        
        <button class="btn-start" onclick="startGame()">시작하기</button>
    </div>

    <!-- 🌟 게임 화면 🌟 -->
    <div id="game-section">
        <h1 style="margin-top: 30px;">메이크업샵 고르기</h1>
        <div id="round-info">준비 중...</div>

        <div id="game" class="container">
            <div class="item" id="left-item" onclick="select(0)">
                <img id="left-img" src="" alt="Left">
                <div class="name" id="left-name">이름</div>
            </div>
            <div class="vs-text">VS</div>
            <div class="item" id="right-item" onclick="select(1)">
                <img id="right-img" src="" alt="Right">
                <div class="name" id="right-name">이름</div>
            </div>
        </div>
    </div>

    <!-- 🌟 결과 화면 🌟 -->
    <div id="result">
        <h2 style="color: #8A7B76; font-size: 2rem;">최종 결과 분석</h2>
        <div class="result-wrapper">
            <div class="winner-box">
                <p style="font-weight: bold; font-size: 1.2rem; color: #9A8C84; margin-bottom: 15px;">나의 원픽 메이크업</p>
                <img id="winner-img" src="" alt="Winner">
                <div id="winner-name" style="font-size: 1.8rem; margin-top: 15px; font-weight: bold;">파일명</div>
            </div>
            
            <div class="ranking-box">
                <div class="ranking-title">📊 가장 많이 선택된 샵 TOP 3</div>
                <div id="rank-list">
                </div>
            </div>
        </div>
        <button class="btn-restart" onclick="location.reload()">다시 하기</button>
    </div>

    <script>
        const data = [
            { name: "daum-a", img: "daum-a.png" }, { name: "daum-b", img: "daum-b.png" },
            { name: "daum-c", img: "daum-c.jpg" }, { name: "daum-d", img: "daum-d.jpg" },
            { name: "jiel-a", img: "jiel-a.jpg" }, { name: "jiel-b", img: "jiel-b.jpg" },
            { name: "jiel-c", img: "jiel-c.png" }, { name: "jiel-d", img: "jiel-d.png" },
            { name: "kim-a", img: "kim-a.jfif" }, { name: "kim-b", img: "kim-b.jfif" },
            { name: "kim-c", img: "kim-c.jfif" }, { name: "kim-d", img: "kim-d.jfif" },
            { name: "mul-a", img: "mul-a.jpeg" }, { name: "mul-c", img: "mul-c.jpg" },
            { name: "mul-d", img: "mul-d.jpg" }, { name: "mul-e", img: "mul-e.jpg" },
            { name: "pure-a", img: "pure-a.png" },
            { name: "sunwoo-a", img: "sunwoo-a.jpg" }, { name: "sunwoo-b", img: "sunwoo-b.jpg" },
            { name: "sunwoo-c", img: "sunwoo-c.jpg" }
        ];

        let shopStats = {};
        let currentRound = [];
        let nextRound = [];
        let currentIndex = 0;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function getShopName(fullName) {
            return fullName.split('-')[0];
        }

        function startGame() {
            document.getElementById("intro").style.display = "none";
            document.getElementById("game-section").style.display = "block";
            
            currentRound = shuffle([...data]); 
            updateRoundText();
            showMatch();
        }

        function updateRoundText() {
            const roundInfo = document.getElementById("round-info");
            if (currentRound.length === 2) {
                roundInfo.innerText = "🏆 결승전 🏆";
            } else {
                let totalMatches = Math.floor(currentRound.length / 2);
                let currentMatch = (currentIndex / 2) + 1;
                roundInfo.innerText = `${currentRound.length}강 (${currentMatch}/${totalMatches})`;
            }
        }

        function showMatch() {
            document.getElementById("left-img").src = currentRound[currentIndex].img;
            document.getElementById("left-name").innerText = currentRound[currentIndex].name;

            document.getElementById("right-img").src = currentRound[currentIndex + 1].img;
            document.getElementById("right-name").innerText = currentRound[currentIndex + 1].name;
        }

        function select(choice) {
            let winner = currentRound[currentIndex + choice];
            nextRound.push(winner);

            let shopName = getShopName(winner.name);
            shopStats[shopName] = (shopStats[shopName] || 0) + 1;

            currentIndex += 2; 

            if (currentIndex === currentRound.length - 1) {
                nextRound.push(currentRound[currentIndex]);
                currentIndex++; 
            }

            if (currentIndex >= currentRound.length) {
                currentRound = nextRound;
                nextRound = [];
                currentIndex = 0;

                if (currentRound.length === 1) {
                    showResult();
                    return;
                }
            }
            updateRoundText();
            showMatch();
        }

        function showResult() {
            document.getElementById("game-section").style.display = "none";
            document.getElementById("result").style.display = "block";

            document.getElementById("winner-img").src = currentRound[0].img;
            document.getElementById("winner-name").innerText = currentRound[0].name;

            const sortedShops = Object.entries(shopStats)
                .sort((a, b) => b[1] - a[1]) 
                .slice(0, 3); 

            const rankListDiv = document.getElementById("rank-list");
            rankListDiv.innerHTML = "";

            sortedShops.forEach((shop, index) => {
                const rankItem = document.createElement("div");
                rankItem.className = `rank-item rank-${index + 1}`;
                rankItem.innerHTML = `
                    <div class="rank-number">${index + 1}</div>
                    <div class="rank-name"><strong>${shop[0]}</strong> <span style="font-size:0.9rem; color:#999; margin-left:10px;">(총 ${shop[1]}회 선택됨)</span></div>
                `;
                rankListDiv.appendChild(rankItem);
            });
        }
    </script>
</body>
</html>
